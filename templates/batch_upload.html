<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga Masiva - BookNFC Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0b0e14;
            --surface: #151a23;
            --border: #263040;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ff4d6d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .btn {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #000;
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
            color: #000;
        }

        .book-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .book-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            font-size: 0.85em;
            color: var(--text-muted);
            font-weight: 600;
        }

        input,
        textarea {
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
        }

        input:focus,
        textarea:focus {
            border-color: var(--accent-cyan);
            outline: none;
        }

        .btn-remove {
            color: var(--danger);
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.1em;
        }

        /* OVERLAY Y BARRA DE PROGRESO */
        .progress-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .progress-box {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: var(--bg-body);
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow: hidden;
            margin: 20px 0 10px 0;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-cyan));
            transition: width 0.2s ease;
            border-radius: 10px;
        }

        .progress-status {
            font-size: 0.9em;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-bar">
            <h2><i class="fa-solid fa-layer-group"></i> Carga Masiva de Obras</h2>
            <a href="/admin" class="btn"><i class="fa-solid fa-arrow-left"></i> Volver al Admin</a>
        </div>

        <form id="batchForm" enctype="multipart/form-data">
            <div id="cardsContainer">
                <!-- Tarjeta Inicial -->
                <div class="book-card">
                    <div class="book-card-header">
                        <span><strong>Obra #1</strong></span>
                        <button type="button" class="btn-remove" onclick="removeCard(this)"><i
                                class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Título de la obra *</label>
                            <input type="text" name="title[]" required placeholder="Ej: Coraline">
                        </div>
                        <div class="form-group">
                            <label>Llave NFC (Opcional)</label>
                            <input type="text" name="nfc_key[]" placeholder="Dejar en blanco para autogenerar">
                        </div>
                        <div class="form-group">
                            <label>Portada (Imagen) *</label>
                            <input type="file" name="cover[]" accept="image/*" required>
                        </div>
                        <div class="form-group">
                            <label>Archivo de la Obra (.cbr, .cbz, .pdf, .epub) *</label>
                            <input type="file" name="file[]" accept=".cbr,.cbz,.pdf,.epub,.rar,.zip" required>
                        </div>
                        <div class="form-group full">
                            <label>Sinopsis / Descripción</label>
                            <textarea name="synopsis[]" rows="2" placeholder="Breve resumen de la obra..."></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button type="button" class="btn" onclick="addCard()"><i class="fa-solid fa-plus"></i> Añadir Otra
                    Obra</button>
                <button type="submit" class="btn btn-primary" id="submitBtn"><i class="fa-solid fa-cloud-arrow-up"></i>
                    Iniciar Subida Masiva</button>
            </div>
        </form>
    </div>

    <!-- MODAL DE PROGRESO DE SUBIDA -->
    <div class="progress-modal" id="progressModal">
        <div class="progress-box">
            <i class="fa-solid fa-cloud-arrow-up fa-3x" style="color: var(--accent-cyan);"></i>
            <h3 style="margin-top: 15px;">Subiendo Archivos a la MicroSD...</h3>

            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>

            <div class="progress-status">
                <span id="progressPercent">0%</span>
                <span id="progressDetails">Enviando datos...</span>
            </div>
        </div>
    </div>

    <script>
        let cardCount = 1;

        function addCard() {
            cardCount++;
            const container = document.getElementById('cardsContainer');
            const cardHtml = `
                <div class="book-card">
                    <div class="book-card-header">
                        <span><strong>Obra #${cardCount}</strong></span>
                        <button type="button" class="btn-remove" onclick="removeCard(this)"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Título de la obra *</label>
                            <input type="text" name="title[]" required placeholder="Ej: Batman Año Uno">
                        </div>
                        <div class="form-group">
                            <label>Llave NFC (Opcional)</label>
                            <input type="text" name="nfc_key[]" placeholder="Dejar en blanco para autogenerar">
                        </div>
                        <div class="form-group">
                            <label>Portada (Imagen) *</label>
                            <input type="file" name="cover[]" accept="image/*" required>
                        </div>
                        <div class="form-group">
                            <label>Archivo de la Obra (.cbr, .cbz, .pdf, .epub) *</label>
                            <input type="file" name="file[]" accept=".cbr,.cbz,.pdf,.epub,.rar,.zip" required>
                        </div>
                        <div class="form-group full">
                            <label>Sinopsis / Descripción</label>
                            <textarea name="synopsis[]" rows="2" placeholder="Breve resumen de la obra..."></textarea>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        }

        function removeCard(btn) {
            const cards = document.getElementsByClassName('book-card');
            if (cards.length > 1) {
                btn.closest('.book-card').remove();
            } else {
                alert("Debes mantener al menos una obra en el formulario.");
            }
        }

        // CONTROLADOR DE SUBIDA CON PROGRESO RECURSIVO
        document.getElementById('batchForm').onsubmit = function (e) {
            e.preventDefault();

            const formData = new FormData(this);
            const xhr = new XMLHttpRequest();

            const modal = document.getElementById('progressModal');
            const barFill = document.getElementById('progressBarFill');
            const percentText = document.getElementById('progressPercent');
            const detailsText = document.getElementById('progressDetails');

            modal.style.display = 'flex';

            xhr.upload.onprogress = function (event) {
                if (event.lengthComputable) {
                    const percentComplete = Math.round((event.loaded / event.total) * 100);
                    barFill.style.width = percentComplete + '%';
                    percentText.innerText = percentComplete + '%';

                    const loadedMB = (event.loaded / (1024 * 1024)).toFixed(1);
                    const totalMB = (event.total / (1024 * 1024)).toFixed(1);
                    detailsText.innerText = `${loadedMB} MB de ${totalMB} MB`;
                }
            };

            xhr.onload = function () {
                if (xhr.status === 200) {
                    detailsText.innerText = "¡Procesando y guardando!";
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 500);
                } else {
                    alert("Error durante la subida. Verifica los archivos.");
                    modal.style.display = 'none';
                }
            };

            xhr.onerror = function () {
                alert("Error de conexión al subir los archivos.");
                modal.style.display = 'none';
            };

            xhr.open('POST', '/admin/batch-upload', true);
            xhr.send(formData);
        };
    </script>
</body>

</html>

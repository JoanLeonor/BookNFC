<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Obras - BookNFC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #0b0e14;
            --surface: #151a23;
            --border: #263040;
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--surface);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h2 {
            font-size: 1.3em;
            font-weight: 700;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 350px;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 14px 10px 38px;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .search-box input:focus {
            border-color: var(--accent-cyan);
            outline: none;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.9em;
        }

        .btn {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #000;
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
            color: #000;
        }

        /* GRID DE OBRAS */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .book-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
        }

        .cover-container {
            width: 100%;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            position: relative;
            background: var(--bg-body);
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-nfc {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(11, 14, 20, 0.85);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 3px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75em;
            font-weight: 700;
            backdrop-filter: blur(4px);
        }

        .card-body {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .book-title {
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-synopsis {
            font-size: 0.8em;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .card-actions .btn {
            flex: 1;
            justify-content: center;
            font-size: 0.82em;
            padding: 8px;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Encabezado de la Galería -->
        <div class="header-bar">
            <div class="header-title">
                <i class="fa-solid fa-layer-group fa-lg" style="color: var(--accent-cyan);"></i>
                <h2>Galería Digital</h2>
            </div>

            <!-- Buscador en tiempo real -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar por título o llave NFC...">
            </div>

            <a href="/admin" class="btn"><i class="fa-solid fa-user-gear"></i> Panel Admin</a>
        </div>

        <!-- Rejilla de Obras -->
        <div class="gallery-grid" id="galleryGrid">
            {% if books %}
            {% for book in books %}
            <div class="book-card" data-title="{{ book.title|lower }}" data-nfc="{{ book.nfc_key|lower }}">
                <div class="cover-container">
                    <img src="/static/covers/{{ book.cover }}" alt="{{ book.title }}" loading="lazy">
                    <span class="badge-nfc">{{ book.nfc_key }}</span>
                </div>
                <div class="card-body">
                    <div>
                        <div class="book-title" title="{{ book.title }}">{{ book.title }}</div>
                        <div class="book-synopsis">{{ book.synopsis }}</div>
                    </div>
                    <div class="card-actions">
                        <a href="/read/{{ book.id }}" class="btn btn-primary"><i class="fa-solid fa-book-open"></i>
                            Leer</a>
                        <a href="/nfc/{{ book.nfc_key }}" class="btn" title="Ficha NFC"><i
                                class="fa-solid fa-nfc-symbol"></i> Ficha</a>
                    </div>
                </div>
            </div>
            {% endfor %}
            {% else %}
            <div class="empty-msg">
                <i class="fa-solid fa-book-open fa-3x" style="margin-bottom: 15px; opacity: 0.5;"></i>
                <p>No hay obras registradas en la biblioteca digital.</p>
            </div>
            {% endif %}
        </div>
    </div>

    <script>
        // Filtro de búsqueda en tiempo real
        document.getElementById('searchInput').addEventListener('input', function (e) {
            const query = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.book-card');

            cards.forEach(card => {
                const title = card.getAttribute('data-title');
                const nfc = card.getAttribute('data-nfc');

                if (title.includes(query) || nfc.includes(query)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>
</body>

</html>
